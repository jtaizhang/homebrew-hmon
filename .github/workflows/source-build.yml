name: Official OHOS source build
on:
  push:
    branches: [source-build]
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pull official build environment
        run: docker pull swr.cn-north-4.myhuaweicloud.com/harmonybrew/ci-runner:latest
      - name: Build and test in official container
        run: |
          docker run --name hmon-ci \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            swr.cn-north-4.myhuaweicloud.com/harmonybrew/ci-runner:latest \
            /bin/sh /work/check-source.sh
